html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,var(--bg2) 0,var(--bg) 360px) no-repeat,var(--bg)}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}

.brand svg{width:46px;height:46px;flex:none}

.brand b i{font-style:normal;color:var(--tick);position:relative}

.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.role{font-size:.8rem;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--surface);color:var(--acc);box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:5px 12px;font:inherit;font-size:.8125rem;cursor:pointer}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:22px 20px 56px;color:#fff;background:linear-gradient(135deg,#1b4fc4,#0c2a86);box-shadow:var(--shadow);margin:8px 0 16px}

.tile .ic.y{background:#fff3cc;color:#b27a00}
:root[data-theme="dark"] .tile .ic.y{background:#3a3010;color:#ffc933}

.tile svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile:hover{transform:translateY(-2px)}
h2.sec{font-size:1.05rem;margin:18px 0 8px;font-weight:800}
.ask{display:flex;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:99px;padding:5px 5px 5px 14px;box-shadow:var(--shadow);align-items:center}
.ask svg{width:20px;height:20px;flex:none;stroke:var(--acc);fill:none;stroke-width:2;stroke-linecap:round}

.send,.ask button{border:0;background:var(--acc);color:var(--onacc);font:inherit;font-weight:700;padding:9px 20px;border-radius:99px;cursor:pointer}
.ask:focus-within{outline:3px solid var(--tick);outline-offset:2px}
.hint{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.85rem;padding:5px 13px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
a.chip{text-decoration:none;display:inline-block}
button:focus-visible,summary:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--tick);outline-offset:2px}
.res{margin:18px 0 10px;font-weight:800}
.sub{color:var(--mute)}
.an{background:#fff3cc;color:#3a2a00;border-left:5px solid var(--tick);border-radius:12px;padding:9px 14px;margin:0 0 14px;font-weight:600}

@media (max-width:640px){.lg{grid-template-columns:1fr}}

.card h2{font-size:1.05rem;margin:0}
.card input:not([type=checkbox]){font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.card label{display:flex;gap:6px;align-items:flex-start}.card label input{width:auto;margin-top:4px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin:0 0 10px;overflow:hidden;box-shadow:var(--shadow)}
.row summary{display:flex;align-items:center;gap:14px;padding:12px 14px;cursor:pointer;list-style:none}
.row summary::-webkit-details-marker{display:none}
.no{flex:none;min-width:46px;height:46px;display:grid;place-items:center;background:var(--tick);color:var(--tickink);font-weight:800;font-size:1.25rem;border-radius:12px;position:relative;font-variant-numeric:tabular-nums}
.no::before,.no::after{content:"";position:absolute;top:50%;width:8px;height:8px;border-radius:50%;background:var(--surface);transform:translateY(-50%)}
.no::before{left:-4px}.no::after{right:-4px}
.nm{font-weight:700;flex:1}
.tag,.cnt{font-size:.75rem;color:var(--acc);background:var(--accsoft);padding:2px 9px;border-radius:99px;white-space:nowrap;font-weight:600}
.cnt.hot{background:var(--warn);color:#fff;font-weight:700}
.row[open] summary{border-bottom:1px dashed var(--line)}
.body{padding:12px 14px 14px 74px}.body p{margin:0 0 8px}
.sys{color:var(--mute);font-size:.9rem}
.best{border:2px solid var(--tick)}
.empty{padding:24px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:16px;background:var(--surface)}
.qa{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}.qa h3{font-size:1rem;margin:0 0 6px}
.qf{display:grid;gap:6px;margin-top:10px;justify-items:start}

.si{margin:0 0 8px;background:var(--surface)}
.thread{display:flex;flex-direction:column;gap:6px;max-height:44vh;overflow-y:auto;padding:2px}
.m{max-width:86%;padding:8px 12px;border-radius:16px 16px 16px 4px;background:var(--accsoft);white-space:pre-wrap;overflow-wrap:anywhere}

.rate{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.em{color:var(--warn);min-height:1.3em;font-size:.9rem;margin:6px 0 0;font-weight:600}
.stat{font-weight:800;margin:14px 0 0}
.adg{display:grid;grid-template-columns:280px 1fr;gap:12px;margin-top:14px}

.ti{text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 12px;cursor:pointer;display:block;width:100%}
.ti[aria-current="true"]{border:2px solid var(--acc)}
.ti b{display:block}.ti span{display:block;font-size:.8rem;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.set{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 14px;margin:10px 0}.set summary{cursor:pointer;font-weight:700}
.tt{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:16px;display:flex;gap:8px;align-items:center;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.35)}.tt span{flex:1}

.foot .rb2{display:block;width:max-content;max-width:90%;margin:-6px auto 0;background:var(--tick);color:var(--tickink);font-weight:800;padding:6px 20px;border-radius:12px;transform:rotate(-1.5deg)}

@media (max-width:560px){.tag{display:none}.body{padding-left:14px}.menu{gap:8px}}
@media (prefers-reduced-motion:no-preference){.tile{transition:transform .15s}}
</style>
